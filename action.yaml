name: Conventional Versioning
description: GitHub Action that returns a semantic version based on Conventional Commits
branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: GitHub token
    default: ${{ github.token }}
  default-bump:
    description: Default version bump (major, minor, or patch)
    default: patch
  ignore-prereleases:
    description: Ignore prereleases when calculating the next version (true or false)
    default: false
  ignore-drafts:
    description: Ignore draft releases when calculating the next version (true or false)
    default: false
  include-scopes:
    description: |
      Newline-separated list of commit scopes to include when calculating the next version.
      When set, only commits with a matching scope are considered.
    default: ''
  exclude-scopes:
    description: |
      Newline-separated list of commit scopes to exclude when calculating the next version.
      Commits with a matching scope are ignored.
    default: ''
  exclude-unscoped-commits:
    description: Ignore conventional commits that have no scope (true or false)
    default: false
outputs:
  version:
    description: Semantic version without prefix
  version-with-prefix:
    description: Semantic version with prefix
  previous-version:
    description: Previous version used for the bump without prefix
  previous-version-with-prefix:
    description: Previous version used for the bump with prefix
  major:
    description: Major version number
  major-with-prefix:
    description: Major version number with prefix
  minor:
    description: Minor version number
  patch:
    description: Patch version number

runs:
  using: "node24"
  main: "dist/index.js"
