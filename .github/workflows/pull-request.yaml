name: pull-request

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit test
        run: yarn test

      - name: Validate Distribution Builds
        run: |
          yarn build
          git diff --exit-code

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get version
        id: version
        uses: ./

      - name: Check version outputs
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('assert')
            const outputs = ${{ toJSON(steps.version.outputs) }}

            // check default / no-input outputs
            const [ major, minor, patch ] = outputs.version.split('.')
            assert.deepEqual(outputs['version-with-prefix'], `v${major}.${minor}.${patch}`)
            assert.deepEqual(outputs.major, major)
            assert.deepEqual(outputs['major-with-prefix'], `v${major}`)
            assert.deepEqual(outputs.minor, minor)
            assert.deepEqual(outputs.patch, patch)

            // check previous version outputs
            const [ prevMajor, prevMinor, prevPatch ] = outputs['previous-version'].split('.')
            assert.deepEqual(outputs['previous-version-with-prefix'], `v${prevMajor}.${prevMinor}.${prevPatch}`)

            // check output is a valid bump string
            assert.deepEqual(['major','minor','patch'].indexOf(outputs.bump) > -1, true)

      # max-major-version: assert invariants only, since the real repo's latest release varies
      - name: Get version with default-bump major (uncapped baseline)
        id: version-uncapped
        uses: ./
        with:
          default-bump: major

      - name: Get version with max-major-version 0 and default-bump major
        id: version-capped
        uses: ./
        with:
          default-bump: major
          max-major-version: '0'

      - name: Check max-major-version cap
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('assert')
            const outputs = ${{ toJSON(steps.version-capped.outputs) }}
            const uncapped = ${{ toJSON(steps.version-uncapped.outputs) }}
            const cap = 0

            assert.deepEqual(['major','minor','patch'].indexOf(outputs.bump) > -1, true)

            // default-bump only applies when commits yield no bump, so compare against the uncapped run
            if (uncapped.bump === 'major') {
              // a major bump was requested, so the cap must have downgraded it to minor
              assert.deepEqual(outputs.bump, 'minor')
            } else {
              // no major bump requested: the cap must not change the result
              assert.deepEqual(outputs.bump, uncapped.bump)
              assert.deepEqual(outputs.version, uncapped.version)
            }

            const prevMajor = Number(outputs['previous-version'].split('.')[0])
            if (prevMajor <= cap) {
              // release line is within the cap: the capped release must not exceed it
              assert.ok(Number(outputs.major) <= cap, `major ${outputs.major} exceeds cap ${cap}`)
            } else {
              // latest release already above the cap: stay on that major line
              assert.deepEqual(Number(outputs.major), prevMajor)
            }

      - name: Get version with invalid max-major-version
        id: version-invalid
        continue-on-error: true
        uses: ./
        with:
          max-major-version: abc

      - name: Check invalid max-major-version fails the step
        run: |
          if [ "${{ steps.version-invalid.outcome }}" != "failure" ]; then
            echo "expected invalid max-major-version to fail, got: ${{ steps.version-invalid.outcome }}"
            exit 1
          fi
